    <circle cx="236" cy="35" r="3.5" fill="#0052cc"/>
    <text x="250" y="39" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">app.sollu.local/dashboard</text>
    <rect x="635" y="29" width="16" height="12" rx="3" fill="#cbd5e1"/>

    <!-- DASHBOARD CONTENT INSIDE MONITOR -->
    <!-- Left Sidebar -->
    <rect x="14" y="56" width="160" height="480" fill="#ffffff"/>
    <line x1="174" y1="56" x2="174" y2="536" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Logo placeholder in sidebar -->
    <rect x="34" y="74" width="22" height="22" rx="6" fill="url(#blueAccent)"/>
    <text x="64" y="90" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="800" fill="#0052cc">SOLLU</text>
    <text x="110" y="90" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#64748b">POS</text>

