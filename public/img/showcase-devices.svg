    <text x="354" y="144" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748b">Total Transaksi</text>
    <text x="354" y="166" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="800" fill="#061a40">218 Struk</text>
