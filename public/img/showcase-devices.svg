    <rect x="0" y="0" width="880" height="550" rx="24" fill="url(#laptopBezel)"/>
    <rect x="0" y="0" width="880" height="550" rx="24" stroke="#1e293b" stroke-width="2"/>

    <!-- Screen Display Area -->
    <rect x="14" y="14" width="852" height="522" rx="16" fill="url(#screenBg)"/>

    <!-- Top Window Titlebar -->
    <rect x="14" y="14" width="852" height="42" rx="16" fill="#ffffff"/>
    <rect x="14" y="44" width="852" height="12" fill="#ffffff"/>
    <line x1="14" y1="56" x2="866" y2="56" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Window Control Dots -->
    <circle cx="38" cy="35" r="5.5" fill="#ef4444"/>
    <circle cx="56" cy="35" r="5.5" fill="#f59e0b"/>
    <circle cx="74" cy="35" r="5.5" fill="#10b981"/>

    <!-- Browser URL Bar -->
