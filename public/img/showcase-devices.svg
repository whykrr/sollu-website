    <circle cx="44" cy="132" r="4" fill="#0052cc"/>
    <text x="56" y="136" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#0052cc">Dashboard</text>

