    <text x="56" y="206" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b">Produk &amp; Stok</text>
    <text x="56" y="240" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b">Multi Cabang</text>
    <text x="56" y="274" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b">Laporan Finansial</text>
    <text x="56" y="308" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b">Pengaturan</text>

