    <!-- Card 1: Omzet -->
    <rect x="196" y="124" width="134" height="68" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="210" y="144" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748b">Total Penjualan</text>
    <text x="210" y="166" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="800" fill="#061a40">Rp 14.85M</text>
    <text x="210" y="182" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#16a34a">+18.4% vs kemarin</text>

