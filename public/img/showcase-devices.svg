<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background & Shading Gradients -->
    <linearGradient id="laptopBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#061a40"/>
    </linearGradient>
    <linearGradient id="screenBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="chartGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0052cc" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0052cc" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052cc"/>
      <stop offset="100%" stop-color="#008fad"/>
    </linearGradient>
    
    <!-- Drop Shadow Filters -->
    <filter id="shadowLarge" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#061a40" flood-opacity="0.18"/>
    </filter>
    <filter id="shadowTablet" x="-20%" y="-20%" width="150%" height="150%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="-10" dy="20" stdDeviation="25" flood-color="#061a40" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- ========================================================= -->
  <!-- 1. COMPUTER / LAPTOP MONITOR FRAME                       -->
  <!-- ========================================================= -->
  <g filter="url(#shadowLarge)" transform="translate(60, 40)">
