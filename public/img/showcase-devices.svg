    <text x="540" y="448" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="800" fill="#061a40">Rp 1.84M</text>

    <text x="214" y="472" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="600" fill="#1e293b">2. Croissant Butter Premium</text>
