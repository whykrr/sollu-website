    <text x="540" y="472" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="800" fill="#061a40">Rp 1.17M</text>

    <text x="214" y="496" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="600" fill="#1e293b">3. Iced Matcha Latte 500ml</text>
    <text x="430" y="496" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#0052cc">38 terjual</text>
    <text x="540" y="496" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="800" fill="#061a40">Rp 988rb</text>
  </g>

  <!-- ========================================================= -->
  <!-- 2. TABLET / MOBILE POS CASH REGISTER (OVERLAPPING FRONT)  -->
