    <line x1="214" y1="430" x2="600" y2="430" stroke="#f1f5f9" stroke-width="1"/>
    
    <text x="214" y="448" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="600" fill="#1e293b">1. Kopi Susu Aren Gula Aren</text>
